<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMS 111 – 100 MCQs</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f4f6;--ac:#c00000;--ok:#15803d;--no:#b91c1c;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--card:#1f2125;--bd:#374151;--ac:#ef4444;--ok:#4ade80;--no:#f87171}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--card:#1f2125;--bd:#374151;--ac:#ef4444;--ok:#4ade80;--no:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;color:var(--ac);margin:.2em 0}
.card{background:var(--card);border-radius:12px;padding:16px;margin:12px 0}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:100%}
.meta{display:flex;justify-content:space-between;font-size:.85rem;opacity:.8;margin:6px 0}
.q{font-size:1.1rem;font-weight:600;margin:10px 0}
button{font:inherit;color:inherit}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--bg))}
.go{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;margin-top:8px}
.ex{margin-top:10px;padding:10px;border-left:4px solid var(--ac);background:var(--bg);border-radius:6px;font-size:.95rem}
.big{font-size:2.4rem;font-weight:700;color:var(--ac)}
.miss{font-size:.9rem;margin:8px 0;padding:8px;background:var(--bg);border-radius:8px}
</style></head><body><main id="app"></main>
<script>
const RAW=`1|General formula of carbohydrates?|CnH2n|(CH2O)n|CnHn|(CHO)n|1|Carbohydrates are polyhydroxyaldehydes or ketones with the formula (CH2O)n.
1|Which sugar is a ketose?|Glucose|Galactose|Fructose|Glyceraldehyde|2|Fructose has its keto group at C2; the others are aldoses.
1|A six-carbon monosaccharide is a:|Triose|Pentose|Tetrose|Hexose|3|Hexoses have 6 carbons (C6H12O6).
2|Aldoses and ketoses differ mainly in their:|Functional group (aldehyde vs ketone)|Number of carbons|Solubility|Ring size only|0|Aldoses carry an aldehyde (-CHO); ketoses carry a ketone (C=O).
1|The sweetest naturally occurring sugar is:|Glucose|Galactose|Maltose|Fructose|3|Fructose, found in honey and fruit, is the sweetest.
1|Galactose rarely occurs free but is found in:|Lactose|Sucrose|Maltose|Starch|0|Lactose = glucose + galactose.
1|Glucose is commonly called:|Fruit sugar|Dextrose|Milk sugar|Malt sugar|1|Glucose is blood sugar, also known as dextrose.
2|A glycosidic bond forms between:|Two OH groups, with loss of water|Two carboxyls, with loss of CO2|An amino and a carboxyl group|A phosphate and a base|0|A hydroxyl of one sugar condenses with a hydroxyl of another, releasing water.
1|The anomeric carbon of glucose is:|C6|C4|C1|C2|2|C1 carries the anomeric OH that is alpha or beta.
1|Which is NOT a glycosidic bond designation in the lecture?|α 1-4|β 1-4|α 1-6|γ 1-4|3|Only α1-4, β1-4 and α1-6 were given.
3|After drinking milk, a patient with lactase deficiency most likely has:|Constipation|Diarrhea and flatulence|Jaundice|Hypoglycemia|1|Lactose malabsorption causes diarrhea and flatulence.
3|Malabsorption of which sugar occurs in sucrase deficiency?|Lactose|Maltose|Sucrose|Galactose|2|Sucrase splits sucrose; deficiency causes diarrhea and flatulence.
1|Maltose arises from:|Cane sugar|Amylase digestion of starch|Milk|Beet sugar|1|Amylase hydrolysis of starch yields maltose.
1|Lactose may appear in urine during:|Fasting|Pregnancy|Exercise|Dehydration|1|The lecture notes lactose can occur in urine in pregnancy.
1|Sucrose is obtained from:|Milk|Starch hydrolysis|Cane and beet sugar|Eggs|2|Sources include cane, beet, sorghum, pineapple and carrot roots.
1|The storage form of glucose in animals is:|Starch|Glycogen|Cellulose|Amylose|1|Glycogen gives a rapid release of energy when needed.
1|The storage form of glucose in plants is:|Starch|Glycogen|Dextrose|Lactose|0|Starch is found in grains, tubers and legumes.
1|The two main forms of starch are:|Glycogen and cellulose|Amylose and glycogen|Amylose and amylopectin|Maltose and sucrose|2|Amylose is linear; amylopectin is branched.
2|Which polysaccharide in the lecture diagram is a straight, unbranched chain?|Amylose|Amylopectin|Glycogen|All of these|0|Amylose is linear; amylopectin and glycogen are branched.
4|Starch is a homopolysaccharide because it:|Contains many sugars|Is made of glucose only|Is branched|Is stored in muscle|1|Homopolysaccharides contain one type of monosaccharide unit.
4|Which is the most extensively branched, per the lecture diagram?|Amylose|Amylopectin|Glycogen|Cellulose|2|Extensive branching in glycogen gives many ends for rapid glucose release.
1|A disaccharide consists of:|Two monosaccharides|Three monosaccharides|Twenty monosaccharides|A single sugar|0|Two monosaccharides joined by a glycosidic bond.
1|Oligosaccharides contain about:|1 unit|2 to 20 units|50 to 100 units|Over 1000 units|1|Oligosaccharides: two to twenty units.
2|Monosaccharides are the basic units of carbohydrates because they:|Cannot be hydrolysed further|Are all sweet|Are all hexoses|Are branched|0|They cannot be broken into smaller sugar units.
5|“Fructose is an aldose.” This statement is:|Correct|Incorrect: it has a keto group|Correct: it has CHO|Incorrect: it is a disaccharide|1|Fructose is a ketose (C=O at C2).
1|Principal building blocks of complex lipids:|Fatty acids|Amino acids|Nucleotides|Monosaccharides|0|Fatty acids build triacylglycerols, phospholipids and more.
1|Waxes are:|Steroids|Polysaccharides|Esters of fatty acids with long-chain alcohols|Amino acid polymers|2|Waxes = fatty acid + long-chain alcohol.
1|Sphingolipids are notably found in:|Plant starch|Brain and membranes|Bone matrix|Saliva|1|They are brain lipids and membrane components.
1|Cholesterol, bile salts and steroid hormones are:|Waxes|Terpenes|Sphingolipids|Steroids|3|All are steroids.
2|A fatty acid consists of:|A ring plus amino group|A long hydrophobic chain plus terminal carboxylate|Glycerol plus phosphate|A sugar plus base|1|Hydrophobic hydrocarbon tail with a COOH head.
2|An unsaturated fatty acid has:|No double bonds|At least one double bond|Only a carboxyl group|A glycerol backbone|1|Saturated = no double bonds.
1|Triacylglycerols mainly function in:|Energy storage|Oxygen transport|Catalysis|Information storage|0|They are the main fuel store.
1|Which is NOT a source of fatty acids?|Diet|Adipolysis|De novo synthesis|Translation|3|Translation makes proteins, not fatty acids.
3|Excess dietary carbohydrate is converted to fatty acids and stored as:|Glycogen only|Triglycerides|Nucleotides|Amino acids|1|Surplus carbs, protein and other molecules become fatty acids stored as triglycerides.
1|Prostaglandins are derivatives of:|Glucose|Fatty acids|Nucleotides|Peptides|1|Fatty acid derivatives act as hormones and messengers.
2|Glycerophospholipids chiefly serve as:|Membrane components|Hormones|Oxygen carriers|Enzymes|0|They are core structural lipids of membranes.
3|When energy is needed, fatty acids released from triacylglycerols are mainly:|Converted to DNA|Oxidized for energy|Excreted unchanged|Made into proteins|1|Mobilized fatty acids are oxidized to meet energy needs.
4|Which is NOT a major role of fatty acids?|Building blocks of phospholipids|Fuel molecules|Hormone and messenger derivatives|Storing genetic information|3|Genetic information is stored in nucleic acids.
2|Covalent attachment of fatty acids to proteins targets them to:|The nucleus|Membrane locations|Ribosomes|Blood plasma|1|Fatty acid modification anchors proteins at membranes.
1|Terpenes are described in the lecture as being like:|Cholesterol|Turpentine|Glycogen|Waxes|1|Terpenes: like turpentine.
2|An amino acid is bifunctional because it has:|Carboxyl and amino groups|Two carboxyls|Two rings|A phosphate and a sugar|0|Both -COOH and -NH2.
1|The α-carbon is the carbon:|At the R-group tip|Next to the carboxyl group|Inside the amino group|At the chain end|1|The amino group sits on the carbon adjacent to the carboxyl.
1|How many amino acids are encoded by the universal genetic code?|11|20|22|300|1|Twenty are encoded; selenocysteine and pyrrolysine make 22 using special mechanisms.
1|Which two proteinogenic amino acids use special incorporation mechanisms?|Selenocysteine and pyrrolysine|Ornithine and citrulline|GABA and carnitine|Cysteine and proline|0|These are the 21st and 22nd proteinogenic amino acids.
2|A peptide bond forms between:|The amino of one residue and carboxyl of another, losing water|Two R groups|Two carboxyls|A phosphate and an amino group|0|Condensation gives the -CO-NH- amide linkage.
1|A tripeptide contains:|Two amino acids|Three amino acids|Four amino acids|Five amino acids|1|Di, tri, tetra, penta refer to 2, 3, 4, 5 residues.
1|Protein synthesis is called:|Transcription|Replication|Translation|Transduction|2|Ribosomes add amino acids in translation.
1|In translation, mRNA serves as the:|Catalyst|Template|Amino acid carrier|Energy source|1|mRNA is the RNA copy of a gene, read via the genetic code.
3|In the dipeptide Ala-Ser, the free α-amino group belongs to:|Ala|Ser|Both|Neither|0|Alanine's amino end is free; serine retains the free carboxyl.
1|Which is a nonpolar amino acid?|Serine|Leucine|Lysine|Aspartate|1|Leucine has a hydrocarbon side chain.
1|Which is polar and uncharged?|Valine|Glutamate|Threonine|Arginine|2|Threonine has a polar hydroxyl, no charge.
1|Positively charged amino acids are:|Asp and Glu|Lys, Arg and His|Ala and Val|Ser and Thr|1|These basic residues carry extra amino groups.
1|Negatively charged (acidic) amino acids are:|Aspartic and glutamic acid|Lysine and arginine|Glycine and alanine|Serine and cysteine|0|Dicarboxylic mono-amino acids.
2|Aspartate is acidic because its R group:|Accepts H+|Is a carboxyl that donates H+|Is hydrophobic|Is an amide|1|Donating H+ leaves a negative charge.
2|Basic amino acids have R groups that:|Donate H+ and are negative|Accept H+ and are positive|Are uncharged|Are aromatic only|1|Amine side chains accept H+.
1|The three BCAAs are:|Leu, Ile, Val|Leu, Lys, Val|Ala, Gly, Val|Ile, Phe, Trp|0|Branched-chain: leucine, isoleucine, valine.
3|A baby has urine smelling like maple syrup. The defective enzyme complex is:|BCKDH|Lactase|Sucrase|Amylase|0|Branched-chain α-keto acid dehydrogenase deficiency causes MSUD.
4|In maple syrup urine disease, which accumulate?|Phe and Tyr|Leu, Ile and Val|Glu and Asp|Lys and Arg|1|Failure to degrade BCAAs builds up them and toxic by-products.
1|BCAAs have been used clinically in:|Hepatic encephalopathy|Lactose intolerance|Asthma|Gout|0|They are also used to aid recovery of burn victims.
1|Which is an essential amino acid?|Alanine|Glycine|Tryptophan|Serine|2|Tryptophan must come from the diet.
1|Which is non-essential (made by the body)?|Lysine|Valine|Methionine|Alanine|3|Alanine is synthesized by the body.
2|Arginine is conditionally essential because it is:|Never made|Insufficient during growth, pregnancy and lactation|Toxic|Only in plants|1|Demand outstrips synthesis in these states.
3|A diet lacking phenylalanine makes which amino acid required?|Tyrosine|Glycine|Alanine|Proline|0|Tyrosine is made from phenylalanine.
1|Per the lecture, humans can make how many of the 20 protein-building amino acids?|5|9|11|20|2|The lecture states 11; the rest must be eaten.
1|Which is a non-proteinogenic amino acid?|GABA|Leucine|Proline|Serine|0|GABA is not found in proteins; it is a neurotransmitter.
2|Hydroxyproline arises by:|A genetic code codon|Post-translational modification|Transcription|Replication|1|It is vital for connective tissue.
3|Carboxylation of glutamate improves binding of:|Sodium|Potassium|Calcium|Chloride|2|This modification enhances calcium binding.
1|Ornithine and citrulline are intermediates in the:|Glycolysis|Urea cycle|Krebs cycle|Fatty acid synthesis|1|They are non-standard amino acids in amino acid catabolism.
1|Hemoglobin's role is:|Oxygen transport|Structural support|Storage|Hormonal signalling|0|It carries O2 in blood.
1|Collagen is mainly a ___ protein:|Transport|Enzymatic|Structural|Hormonal|2|It forms bone, tendons and cartilage.
1|Actin and myosin enable:|Digestion|Muscle contraction|Immunity|Oxygen transport|1|They are movement proteins.
1|Pepsin is a protein that:|Stores iron|Catalyzes protein hydrolysis|Contracts muscle|Transports lipids|1|It is a digestive enzyme.
1|Immunoglobulins function in:|Protection|Movement|Storage|Structure|0|They stimulate immunity.
4|Which R group has a pKa near 6.5, buffering near physiological pH?|Histidine|Lysine|Arginine|Aspartate|0|Histidine's imidazole ionizes around pH 6.5.
1|The one-letter code for tryptophan is:|T|W|Y|F|1|Mnemonic: tWo rings.
1|Nucleic acids are classified into:|DNA and RNA|Protein and lipid|Starch and glycogen|ATP and ADP|0|DNA and RNA.
2|DNA functions mainly in:|Catalysis|Information storage|Energy storage|Transport|1|RNAs handle gene expression and protein synthesis.
1|A nucleotide consists of:|Base, sugar and phosphate|Base and amino acid|Sugar and fatty acid|Phosphate and glycerol|0|Base + pentose + phosphate.
1|Purine bases are:|C and T|A and G|U and C|T and U|1|Adenine and guanine.
1|The base found only in RNA is:|Thymine|Adenine|Uracil|Cytosine|2|DNA uses thymine instead.
1|Thymine is the ___ derivative of uracil:|5-methyl|2-amino|3-hydroxyl|6-carboxyl|0|5-methyluracil.
2|A pyrimidine is:|A single six-membered ring with N at positions 1 and 3|Two fused rings|A five-membered ring|A straight chain|0|Cytosine, thymine and uracil.
1|Base + sugar with no phosphate is a:|Nucleotide|Nucleoside|Codon|Dinucleotide|1|Adding phosphate makes a nucleotide.
1|Adenine + ribose gives:|Adenosine|Adenylate|Deoxyadenosine|Inosine|0|Adenylate is the monophosphate.
2|The N-glycosidic bond joins sugar C-1 to purine ___ or pyrimidine ___:|N-9; N-1|N-1; N-9|N-3; N-7|N-7; N-3|0|Purines at N-9, pyrimidines at N-1.
1|The N-glycosidic bond configuration is always:|α|β|γ|δ|1|It always adopts the beta configuration.
1|In cells, a nucleoside is usually phosphorylated at the sugar's:|5′-OH|1′-OH|2′-OH|4′ carbon|0|The 5′-OH is esterified with phosphoric acid.
1|dTMP stands for:|Deoxythymidine 5′-monophosphate|Deoxyuridine monophosphate|Thymine triphosphate|Dideoxy TMP|0|One component of DNA.
2|Phosphates in ATP are linked by:|Peptide bonds|Acid-anhydride (phosphoanhydride) bonds|Glycosidic bonds|Hydrogen bonds|1|These are high-energy bonds.
2|A nucleotide's phosphate links to the next nucleotide's:|3′-OH|5′-OH|Base|2′-H|0|This forms the phosphodiester bond.
1|A dinucleotide has a free phosphate at the ___ end and free OH at the ___ end:|5′; 3′|3′; 5′|2′; 5′|1′; 3′|0|Free 5′ phosphate and free 3′ OH.
3|Polynucleotide sequences are written:|3′ to 5′|5′ to 3′, left to right|Randomly|2′ to 1′|1|Convention is 5′→3′.
1|A–T base pairs share how many hydrogen bonds?|1|2|3|4|1|G–C share three.
4|Which DNA melts at the highest temperature?|A–T rich|G–C rich|Poly-U|Poly-A|1|Three H-bonds per G–C pair give more stability than two per A–T pair.
2|The two DNA strands are:|Parallel|Antiparallel|Unpaired|Always circular|1|They run in opposite directions.
1|DNA differs from RNA in lacking the hydroxyl at:|C-1′|C-2′|C-3′|C-5′|1|DNA uses 2′-deoxyribose.
4|Why does the double helix have uniform width?|Each pair is a purine with a pyrimidine|Both are purines|Both are pyrimidines|Uracil bridges them|0|Pairing a two-ring with a one-ring base keeps equal spacing.
2|Phosphate backbone repulsion in DNA is reduced by:|Mg2+ and Arg/Lys-rich proteins|Anions|Water loss|Heat|0|Cations shield the negative phosphates.
5|“DNA contains uracil in place of thymine.” This is:|True|False: DNA has thymine; uracil is in RNA|True only in bacteria|True in the nucleus|1|Uracil is RNA-specific.
6|The complementary strand of 5′-ATGC-3′, written 5′→3′, is:|5′-TACG-3′|5′-GCAT-3′|5′-ATGC-3′|5′-CGTA-3′|1|Pairing gives 3′-TACG-5′, which reads 5′-GCAT-3′.`;
const L=["","Remember","Understand","Apply","Analyze","Evaluate","Create"];
const ALL=RAW.split("\n").map(s=>{const p=s.split("|");return{l:+p[0],q:p[1],o:p.slice(2,6).map((t,i)=>({t,c:i==+p[6]})),e:p[7]}});
const app=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let Q,i,score,miss,tm,left;
function start(list){Q=sh(list).map(x=>({...x,o:sh(x.o)}));i=0;score=0;miss=[];show()}
function home(){app.innerHTML=`<h1>SMS 111 · Biological Chemistry III &amp; IV</h1><div class="card"><p>${ALL.length} MCQs: carbohydrates, lipids, amino acids &amp; proteins, nucleic acids. Bloom's levels from Remember to Create.</p><p>⏱ 60 seconds per question. Explanations after every answer.</p><button class="go" id="s">Start quiz</button></div>`;document.getElementById("s").onclick=()=>start(ALL)}
function show(){clearInterval(tm);if(i>=Q.length)return end();const q=Q[i];left=60;
app.innerHTML=`<div class="meta"><span>Q ${i+1}/${Q.length} · ${L[q.l]}</span><span id="t">60s</span></div><div class="bar"><i id="b"></i></div><div class="card"><div class="q">${q.q}</div>${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${"ABCD"[k]}. ${o.t}</button>`).join("")}<div id="x"></div></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
tm=setInterval(()=>{left--;document.getElementById("t").textContent=left+"s";document.getElementById("b").style.width=(left/60*100)+"%";if(left<=0)pick(-1)},1000)}
function pick(k){clearInterval(tm);const q=Q[i];const bs=app.querySelectorAll(".opt");bs.forEach((b,j)=>{b.disabled=true;b.onclick=null;if(q.o[j].c)b.classList.add("ok");else if(j==k)b.classList.add("no")});
const right=k>=0&&q.o[k].c;if(right)score++;else miss.push(q);
document.getElementById("x").innerHTML=`<div class="ex"><b>${right?"✅ Correct":k<0?"⏰ Time's up":"❌ Wrong"}.</b> ${q.e}</div><button class="go" id="n">${i+1<Q.length?"Next":"See results"}</button>`;document.getElementById("n").onclick=()=>{i++;show()}}
function end(){app.innerHTML=`<h1>Results</h1><div class="card"><div class="big">${score}/${Q.length}</div><p>${Math.round(score/Q.length*100)}%</p><button class="go" id="r">Restart all</button> ${miss.length?`<button class="go" id="m">Retry ${miss.length} missed</button>`:""}</div>${miss.map(m=>`<div class="miss"><b>${m.q}</b><br>Answer: ${m.o.find(o=>o.c).t}<br>${m.e}</div>`).join("")}`;
document.getElementById("r").onclick=()=>start(ALL);const m=document.getElementById("m");if(m)m.onclick=()=>start(miss.map(x=>({...x})))}
home();
</script></body></html>
